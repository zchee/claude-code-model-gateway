version: "2"

linters:
  default: standard
  enable:
    - bodyclose # Prevent HTTP response and connection leaks.
    - errorlint # Preserve wrapped errors across CLI and daemon layers.
    - gochecknoinits # Tests must not run initialization code before the venue guard.
    - godot # Keep Go declaration comments punctuated.
    - noctx # Carry cancellation through network requests and subprocesses.
    - nolintlint # Require scoped, explained exceptions to lint rules.
    - nosprintfhostport # Avoid malformed addresses when a host is IPv6.
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      module-path: github.com/zchee/claude-code-model-gateway
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
