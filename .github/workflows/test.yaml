name: Build, lint, and test

on:
  push:
    branches:
      - main
      - 'port/**'
  pull_request:
  workflow_dispatch:
    inputs:
      conformance_phase:
        description: Gate phase for hosted binary conformance export (auto reads .github/conformance-phase)
        required: false
        default: auto
        type: string
      node_baseline:
        description: Also run the pinned Node gateway baseline on the hosted macOS runner
        required: false
        default: false
        type: boolean
      node_baseline_interrupt:
        description: Also interrupt the macOS Node baseline on purpose to check its cleanup (publishes no baseline)
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  # A baseline dispatch has a group of its own, named before the ref so that no
  # other ref's group can coincide with it and no push can cancel the
  # measurement; every other run keeps the shared group.
  group: ${{ github.workflow }}-${{ inputs.node_baseline_interrupt && 'node-baseline-interrupt-' || inputs.node_baseline && 'node-baseline-' || '' }}${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-26.04
          - xcode-27
    runs-on: ${{ matrix.runner }}
    outputs:
      conformance_phase: ${{ steps.conformance_phase.outputs.phase }}
    env:
      TEST_EVIDENCE_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install pinned tools
        env:
          GOBIN: ${{ runner.temp }}/go-tools
        run: |
          make tools
          printf '%s\n' "$GOBIN" >> "$GITHUB_PATH"
      - name: Build, vet, and check formatting
        run: make build vet fmt-check
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Use the version installed by make tools rather than a second pin.
          install-mode: none
      - name: Lint with the process tag
        uses: golangci/golangci-lint-action@v9
        with:
          install-mode: none
          args: --build-tags process
          skip-cache: true
          verify: false
      - name: Cross-compile for Windows
        run: GOOS=windows GOARCH=amd64 go build ./...
      - name: Check test guards
        run: ./hack/lint-venue
      - name: Check test obligations
        run: ./hack/parity-check structure
      - name: Attest hosted runner
        id: attest
        run: ./hack/venue-attest-ci
      - name: Run tests
        id: tests
        run: |
          evidence="$RUNNER_TEMP/go-test-plain.jsonl"
          rc=
          ./hack/go-test-evidence plain "$TEST_EVIDENCE_RUN_ID" "$evidence" || rc=$?
          if [ -f "$evidence" ]; then
            jq -j 'select(.Action == "output" or .Action == "build-output") | .Output // empty' "$evidence" || rc=${rc:-$?}
          fi
          exit "${rc:-0}"
      - name: Run process tests
        id: process_tests
        # A failure in the plain suite must not hide the process suite's result.
        # Both run only on an attested runner.
        if: ${{ !cancelled() && steps.attest.outcome == 'success' && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: |
          evidence="$RUNNER_TEMP/go-test-process.jsonl"
          rc=
          ./hack/go-test-evidence process "$TEST_EVIDENCE_RUN_ID" "$evidence" || rc=$?
          if [ -f "$evidence" ]; then
            jq -j 'select(.Action == "output" or .Action == "build-output") | .Output // empty' "$evidence" || rc=${rc:-$?}
          fi
          exit "${rc:-0}"
      - name: Upload test evidence
        id: test_evidence
        if: ${{ !cancelled() && steps.attest.outcome == 'success' && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: go-test-${{ matrix.runner }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/go-test-plain.jsonl
            ${{ runner.temp }}/go-test-process.jsonl
          if-no-files-found: error
      - name: Resolve conformance phase
        id: conformance_phase
        # Runs after Go evidence upload on both matrix legs so the job output
        # stays consistent regardless of which leg finishes last, and a bad
        # phase file cannot block attestation, Go tests, or Go evidence upload.
        # When .github/conformance-phase is present, validate it first as raw
        # bytes identically on both runners using the same phase validator as
        # the dispatch input; only after it passes may an explicit dispatch
        # input override the phase it names.
        if: ${{ !cancelled() && steps.attest.outcome == 'success' && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') && (steps.test_evidence.outcome == 'success' || steps.test_evidence.outcome == 'failure') }}
        env:
          INPUT_PHASE: ${{ inputs.conformance_phase }}
        run: |
          phase=$(python3 -I - <<'PY'
          import os
          import stat
          import sys

          SUPPORTED = frozenset({"phase-2", "phase-3", "phase-4", "phase-5"})
          PATH = ".github/conformance-phase"


          def validate_phase(value: str, source: str) -> str:
              if value not in SUPPORTED:
                  print(
                      f"unsupported conformance phase from {source}: {value!r}",
                      file=sys.stderr,
                  )
                  sys.exit(2)
              return value


          file_phase = ""
          if os.path.lexists(PATH):
              try:
                  st = os.lstat(PATH)
              except OSError as exc:
                  print(f"{PATH} must be a regular file: {exc}", file=sys.stderr)
                  sys.exit(2)
              if not stat.S_ISREG(st.st_mode):
                  print(f"{PATH} must be a regular file", file=sys.stderr)
                  sys.exit(2)
              try:
                  fd = os.open(PATH, os.O_RDONLY | os.O_NOFOLLOW)
              except OSError as exc:
                  print(f"{PATH} must be a regular file: {exc}", file=sys.stderr)
                  sys.exit(2)
              with os.fdopen(fd, "rb") as fh:
                  if not stat.S_ISREG(os.fstat(fh.fileno()).st_mode):
                      print(f"{PATH} must be a regular file", file=sys.stderr)
                      sys.exit(2)
                  raw = fh.read()
              # Reject NUL and any other ASCII control byte (C0 except LF, and DEL).
              if any(b != 0x0A and (b < 0x20 or b == 0x7F) for b in raw):
                  print(f"{PATH} must not contain NUL or control bytes", file=sys.stderr)
                  sys.exit(2)
              try:
                  text = raw.decode("utf-8")
              except UnicodeDecodeError:
                  print(f"{PATH} must be valid UTF-8", file=sys.stderr)
                  sys.exit(2)
              if any(0x80 <= ord(ch) <= 0x9F for ch in text):
                  print(f"{PATH} must not contain control characters", file=sys.stderr)
                  sys.exit(2)
              for line in text.split("\n"):
                  if line == "" or line.startswith("#"):
                      continue
                  if file_phase:
                      print(
                          f"{PATH} must contain exactly one phase line",
                          file=sys.stderr,
                      )
                      sys.exit(2)
                  file_phase = line
              if not file_phase:
                  print(
                      f"{PATH} must contain exactly one supported phase",
                      file=sys.stderr,
                  )
                  sys.exit(2)
              file_phase = validate_phase(file_phase, PATH)

          dispatch_phase = os.environ.get("INPUT_PHASE", "")
          if dispatch_phase and dispatch_phase != "auto":
              phase = validate_phase(dispatch_phase, "workflow_dispatch input")
          else:
              phase = file_phase

          sys.stdout.write(phase)
          PY
          ) || exit $?
          printf 'phase=%s\n' "$phase" >> "$GITHUB_OUTPUT"
      - name: Set up pinned Node for conformance
        id: setup_node
        if: ${{ !cancelled() && matrix.runner == 'ubuntu-26.04' && steps.attest.outcome == 'success' && steps.conformance_phase.outcome == 'success' && steps.conformance_phase.outputs.phase != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: '24.11.1'
      - name: Install lsof for conformance
        id: install_lsof
        # Disposable-runner exception: installing via apt-get writes to system
        # paths, which is acceptable because GitHub-hosted runners are discarded
        # after the job. The pinned suite's own process supervisor calls lsof on
        # Linux to identify port owners, and two conformance cases due at a
        # later gate fail without it (test/conformance/baseline/README.md lines
        # 35 and 39).
        if: ${{ !cancelled() && matrix.runner == 'ubuntu-26.04' && steps.attest.outcome == 'success' && steps.conformance_phase.outcome == 'success' && steps.conformance_phase.outputs.phase != '' && steps.setup_node.outcome == 'success' }}
        run: |
          if ! command -v lsof >/dev/null; then
            sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends lsof
          fi
      - name: Run binary conformance export
        id: conformance
        # Run on the attested hosted Linux runner whenever a conformance phase is
        # selected, even if a Go suite failed, so diagnostics are visible; upload
        # requires all suites on this runner to pass, and final publication runs
        # only after both matrix legs succeed in the same attempt.
        if: ${{ !cancelled() && matrix.runner == 'ubuntu-26.04' && steps.attest.outcome == 'success' && steps.conformance_phase.outcome == 'success' && steps.conformance_phase.outputs.phase != '' && steps.setup_node.outcome == 'success' && steps.install_lsof.outcome == 'success' }}
        env:
          PHASE: ${{ steps.conformance_phase.outputs.phase }}
          MAX_TIMEOUT_SECONDS: '600'
          TIMEOUT_SECONDS: '600'
          # Keep temporary fixture Unix socket paths within Linux's 108-byte AF_UNIX limit.
          TMPDIR: /tmp
        run: |
          node_ver=$(node --version)
          if [[ $node_ver != v24.11.1 ]]; then
            printf 'unexpected Node version: %s (expected v24.11.1)\n' "$node_ver" >&2
            exit 70
          fi
          real_temp=$(realpath "$RUNNER_TEMP")
          npm_cache="$real_temp/npm-cache"
          mkdir -p "$npm_cache"
          bin="$real_temp/conformance-model-gateway"
          export_dir="$real_temp/conformance-export"
          go build -o "$bin" .
          npm_config_cache="$npm_cache" TARGET="binary:$bin" EXPORT_DIR="$export_dir" ./hack/conformance-export run
          ./hack/conformance-export verify "$export_dir"
          printf 'export_dir=%s\n' "$export_dir" >> "$GITHUB_OUTPUT"
      - name: Upload conformance export candidate
        if: ${{ !cancelled() && matrix.runner == 'ubuntu-26.04' && steps.attest.outcome == 'success' && steps.tests.outcome == 'success' && steps.process_tests.outcome == 'success' && steps.test_evidence.outcome == 'success' && steps.conformance_phase.outcome == 'success' && steps.conformance_phase.outputs.phase != '' && steps.conformance.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: conformance-export-candidate-${{ steps.conformance_phase.outputs.phase }}-${{ github.run_attempt }}
          path: ${{ steps.conformance.outputs.export_dir }}
          if-no-files-found: error

  publish-conformance-export:
    permissions: {}
    needs:
      - checks
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.checks.outputs.conformance_phase != '' }}
    runs-on: ubuntu-26.04
    env:
      TEST_EVIDENCE_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
      CONFORMANCE_PHASE: ${{ needs.checks.outputs.conformance_phase }}
    steps:
      - name: Download Linux test evidence
        uses: actions/download-artifact@v8
        with:
          name: go-test-ubuntu-26.04-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publish-check/ubuntu-26.04
      - name: Download macOS test evidence
        uses: actions/download-artifact@v8
        with:
          name: go-test-xcode-27-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publish-check/xcode-27
      - name: Download conformance export candidate
        uses: actions/download-artifact@v8
        with:
          name: conformance-export-candidate-${{ needs.checks.outputs.conformance_phase }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publish-check/candidate
      - name: Verify attempt evidence and candidate
        run: |
          base="$RUNNER_TEMP/publish-check"
          for runner in ubuntu-26.04 xcode-27; do
            for suite in plain process; do
              file="$base/$runner/go-test-$suite.jsonl"
              if [[ -L $file || ! -f $file ]]; then
                printf 'missing Go test evidence: %s\n' "$file" >&2
                exit 1
              fi
              if ! head -n 1 "$file" | jq -es --arg commit "$GITHUB_SHA" --arg run_id "$TEST_EVIDENCE_RUN_ID" \
                'length == 1 and .[0].commit == $commit and .[0].run_id == $run_id' >/dev/null; then
                printf 'wrong Go test evidence metadata: %s\n' "$file" >&2
                exit 1
              fi
            done
          done

          cand="$base/candidate"
          shopt -s dotglob nullglob
          entries=("$cand"/*)
          shopt -u dotglob nullglob
          if [[ ${#entries[@]} -ne 3 ]]; then
            printf 'expected 3 candidate files, found %d\n' "${#entries[@]}" >&2
            exit 1
          fi
          for name in census.tsv launches.tsv manifest.json; do
            if [[ -L "$cand/$name" || ! -f "$cand/$name" ]]; then
              printf 'missing or non-regular candidate file: %s\n' "$name" >&2
              exit 1
            fi
          done

          if ! jq -es \
            --arg commit "$GITHUB_SHA" \
            --arg run_id "$TEST_EVIDENCE_RUN_ID" \
            --arg phase "$CONFORMANCE_PHASE" \
            'length == 1
             and .[0].producer == "hosted"
             and .[0].commit == $commit
             and .[0].run_id == $run_id
             and .[0].phase == $phase
             and .[0].clean_tree == true
             and .[0].verdict == "pass"
             and .[0].status == 0
             and .[0].selection == ("conformance<=" + $phase)' \
            "$cand/manifest.json" >/dev/null; then
            printf 'candidate manifest failed verification\n' >&2
            exit 1
          fi

          for tsv in census.tsv launches.tsv; do
            if ! head -n 1 "$cand/$tsv" | jq -es --arg commit "$GITHUB_SHA" --arg run_id "$TEST_EVIDENCE_RUN_ID" \
              'length == 1 and .[0].commit == $commit and .[0].run_id == $run_id' >/dev/null; then
              printf 'wrong metadata header in %s\n' "$tsv" >&2
              exit 1
            fi
          done
      - name: Upload conformance export
        uses: actions/upload-artifact@v7
        with:
          name: conformance-export-${{ needs.checks.outputs.conformance_phase }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publish-check/candidate
          if-no-files-found: error

  node-baseline-darwin:
    # The pinned Node gateway's baseline on hosted macOS, only when a dispatch
    # asks for it. Containment is this runner's teardown after the job plus the
    # benchmark's own marker sweep.
    # Never in the same dispatch as the interruption control.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.node_baseline && !inputs.node_baseline_interrupt }}
    permissions:
      contents: read
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      # Recorded in the run record, so that a sample names the job it came from.
      BENCH_JOB: node-baseline-darwin
    steps:
      - name: Prepare the attempt directory
        # Before checkout, so that even a failed checkout uploads a marked attempt.
        run: |
          base="$RUNNER_TEMP/node-baseline-darwin"
          mkdir -p -- "$base/full" "$base/half-close"
          printf 'incomplete: the attempt has not finished\n' > "$base/status"
          {
            printf 'repository: %s\ncommit: %s\nref: %s\nrun: %s attempt %s\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'runner: %s %s %s\nimage: %s %s\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS-}" "${ImageVersion-}"
            printf 'started: %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            sw_vers || :
            uname -a || :
            sysctl machdep.cpu.brand_string hw.model hw.physicalcpu hw.logicalcpu hw.memsize || :
            for tool in bash python3 perl lsof ps git make; do printf '%s: %s\n' "$tool" "$(command -v "$tool")"; done
            bash --version || :
            python3 --version || :
            perl -e 'print "perl: $^V\n"' || :
          } > "$base/runner.txt" 2>&1
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.11.1'
      - name: Check the Node version
        run: |
          node_ver=$(node --version)
          printf 'node: %s (%s)\nnpm: %s\n' "$node_ver" "$(command -v node)" "$(npm --version)" >> "$RUNNER_TEMP/node-baseline-darwin/runner.txt"
          if [[ $node_ver != v24.11.1 ]]; then
            printf 'unexpected Node version: %s (expected v24.11.1)\n' "$node_ver" >&2
            exit 70
          fi
      - name: Attest hosted runner
        id: attest
        run: ./hack/venue-attest-ci
      - name: Run the baseline
        id: full
        timeout-minutes: 20
        env:
          BENCH_ARTIFACT_DIR: ${{ runner.temp }}/node-baseline-darwin/full
        run: |
          rc=0
          make -- bench > "$BENCH_ARTIFACT_DIR.out" 2> "$BENCH_ARTIFACT_DIR.err" || rc=$?
          cat -- "$BENCH_ARTIFACT_DIR.err" >&2
          exit "$rc"
      - name: Run the half-close probe
        id: half_close
        # Runs after a failed full run as well, so that its diagnostics are kept.
        if: ${{ !cancelled() && steps.attest.outcome == 'success' }}
        timeout-minutes: 10
        env:
          BENCH_ARTIFACT_DIR: ${{ runner.temp }}/node-baseline-darwin/half-close
        run: |
          rc=0
          make -- bench BENCH_PROBE=half-close > "$BENCH_ARTIFACT_DIR.out" 2> "$BENCH_ARTIFACT_DIR.err" || rc=$?
          cat -- "$BENCH_ARTIFACT_DIR.err" >&2
          exit "$rc"
      - name: Verify and decode the samples
        id: verify
        # Each frame is printed only after its run's cleanup succeeded. The
        # decoded files are staged outside the upload tree and move into
        # darwin/ only after every check and the summary succeeded.
        if: ${{ !cancelled() && steps.full.outcome == 'success' && steps.half_close.outcome == 'success' }}
        run: |
          base="$RUNNER_TEMP/node-baseline-darwin"
          staging="$RUNNER_TEMP/node-baseline-darwin-staging"
          mkdir -- "$staging" "$staging/darwin"
          label="$BENCH_JOB job of .github/workflows/test.yaml on the hosted xcode-27 runner"
          ./hack/baseline-bench verify --platform darwin --job "$label" full "$base/full.out" "$staging/darwin/measurements.jsonl" > "$staging/verify.txt"
          ./hack/baseline-bench verify --platform darwin --job "$label" half-close "$base/half-close.out" "$staging/darwin/half-close.jsonl" >> "$staging/verify.txt"
          ./hack/baseline-bench summary --platform darwin "$staging/darwin/measurements.jsonl" > "$staging/summary.md"
          cat -- "$staging/verify.txt" "$staging/summary.md"
          mv -- "$staging/verify.txt" "$staging/summary.md" "$base/"
          # The last fallible command: darwin/ appears only when everything else succeeded.
          mv -- "$staging/darwin" "$base/darwin"
      - name: Record the attempt outcome
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          ATTEST: ${{ steps.attest.outcome }}
          FULL: ${{ steps.full.outcome }}
          HALF_CLOSE: ${{ steps.half_close.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          base="$RUNNER_TEMP/node-baseline-darwin"
          mkdir -p -- "$base"
          result=incomplete
          if [[ $VERIFY == success && $JOB_STATUS == success && -d $base/darwin ]]; then result=complete; fi
          # An incomplete attempt uploads no canonical sample files.
          if [[ $result == incomplete ]]; then rm -rf -- "${base:?}/darwin"; fi
          printf '%s\njob: %s\nattestation: %s\nfull run: %s\nhalf-close probe: %s\nverification: %s\nfinished: %s\n' \
            "$result" "$JOB_STATUS" "$ATTEST" "$FULL" "$HALF_CLOSE" "$VERIFY" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > "$base/status"
          cat -- "$base/status"
      - name: Upload the attempt
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: node-baseline-darwin-${{ github.run_attempt }}
          path: ${{ runner.temp }}/node-baseline-darwin
          if-no-files-found: error

  node-baseline-inputs:
    # The baseline and its interruption control are separate dispatches.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.node_baseline && inputs.node_baseline_interrupt }}
    permissions: {}
    runs-on: ubuntu-26.04
    steps:
      - name: Refuse both baseline inputs
        run: |
          printf 'node_baseline and node_baseline_interrupt are mutually exclusive; dispatch them separately\n' >&2
          exit 1

  node-baseline-darwin-interrupt:
    # Interrupts the macOS bench on purpose, once with TERM after it has started
    # its gateway children and once by letting its step run into the step
    # deadline, beside an unrelated process that must survive. It checks what
    # cleanup did and never publishes a baseline.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.node_baseline_interrupt && !inputs.node_baseline }}
    permissions:
      contents: read
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      BENCH_JOB: node-baseline-darwin-interrupt
    steps:
      - name: Prepare the attempt directory
        run: |
          base="$RUNNER_TEMP/node-baseline-darwin-interrupt"
          mkdir -p -- "$base/term" "$base/deadline"
          printf 'incomplete: interruption control, never a baseline\n' > "$base/status"
          {
            printf 'repository: %s\ncommit: %s\nref: %s\nrun: %s attempt %s\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'image: %s %s\nstarted: %s\n' "${ImageOS-}" "${ImageVersion-}" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            sw_vers || :
            python3 --version || :
          } > "$base/runner.txt" 2>&1
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.11.1'
      - name: Check the Node version
        run: |
          node_ver=$(node --version)
          printf 'node: %s\n' "$node_ver" >> "$RUNNER_TEMP/node-baseline-darwin-interrupt/runner.txt"
          if [[ $node_ver != v24.11.1 ]]; then
            printf 'unexpected Node version: %s (expected v24.11.1)\n' "$node_ver" >&2
            exit 70
          fi
      - name: Attest hosted runner
        id: attest
        run: ./hack/venue-attest-ci
      - name: Start the unrelated control process
        id: control
        # Started before every bench in a session of its own, with a minimal
        # environment: the sweeps must leave it alone. One snapshot records its
        # start time and command. Every control runs the venue check first.
        run: ./hack/baseline-darwin-controls control-start "$RUNNER_TEMP/node-baseline-darwin-interrupt"
      - name: Interrupt the bench with TERM
        id: term
        continue-on-error: true
        timeout-minutes: 15
        run: ./hack/baseline-darwin-controls term "$RUNNER_TEMP/node-baseline-darwin-interrupt"
      - name: Fixture, a marked detached orphan
        id: fixture_marked
        if: ${{ !cancelled() && steps.attest.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: ./hack/baseline-darwin-controls fixture "$RUNNER_TEMP/node-baseline-darwin-interrupt" marked-orphan
      - name: Fixture, an unmarked detached orphan
        id: fixture_unmarked
        if: ${{ !cancelled() && steps.attest.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: ./hack/baseline-darwin-controls fixture "$RUNNER_TEMP/node-baseline-darwin-interrupt" unmarked-orphan
      - name: Fixture, a failed signal before the target exits
        id: fixture_signal
        if: ${{ !cancelled() && steps.attest.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: ./hack/baseline-darwin-controls fixture "$RUNNER_TEMP/node-baseline-darwin-interrupt" signal-failure
      - name: Fixture, an empty process listing
        id: fixture_zero
        if: ${{ !cancelled() && steps.attest.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: ./hack/baseline-darwin-controls fixture "$RUNNER_TEMP/node-baseline-darwin-interrupt" listing-zero
      - name: Fixture, a process listing without the supervisor
        id: fixture_without_self
        if: ${{ !cancelled() && steps.attest.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: ./hack/baseline-darwin-controls fixture "$RUNNER_TEMP/node-baseline-darwin-interrupt" listing-without-self
      - name: Let the bench run into its step deadline
        id: deadline
        # Last, so that whatever the runner leaves of this run cannot affect
        # another control. A full run idles three times 60 s; it cannot end in
        # 2 min unless it fails.
        if: ${{ !cancelled() && steps.attest.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        run: ./hack/baseline-darwin-controls deadline "$RUNNER_TEMP/node-baseline-darwin-interrupt"
      - name: Record the cleanup outcomes
        id: outcomes
        if: ${{ always() && steps.attest.outcome == 'success' }}
        env:
          DEADLINE_OUTCOME: ${{ steps.deadline.outcome }}
        run: ./hack/baseline-darwin-controls outcomes "$RUNNER_TEMP/node-baseline-darwin-interrupt" "$DEADLINE_OUTCOME"
      - name: Check the interruption outcomes
        id: assertions
        if: ${{ always() && steps.attest.outcome == 'success' }}
        # Each fixture counts only with its step's success and its completion
        # sentinel, written after every check and the owner's release.
        env:
          TERM_OUTCOME: ${{ steps.term.outcome }}
          MARKED: ${{ steps.fixture_marked.outcome }}
          UNMARKED: ${{ steps.fixture_unmarked.outcome }}
          SIGNAL: ${{ steps.fixture_signal.outcome }}
          ZERO: ${{ steps.fixture_zero.outcome }}
          WITHOUT_SELF: ${{ steps.fixture_without_self.outcome }}
        run: |
          ./hack/baseline-darwin-controls assert "$RUNNER_TEMP/node-baseline-darwin-interrupt" "$TERM_OUTCOME" \
            "marked-orphan=$MARKED" "unmarked-orphan=$UNMARKED" "signal-failure=$SIGNAL" \
            "listing-zero=$ZERO" "listing-without-self=$WITHOUT_SELF"
      - name: Record the attempt outcome
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          TERM_OUTCOME: ${{ steps.term.outcome }}
          DEADLINE_OUTCOME: ${{ steps.deadline.outcome }}
          ASSERTIONS: ${{ steps.assertions.outcome }}
        run: |
          base="$RUNNER_TEMP/node-baseline-darwin-interrupt"
          mkdir -p -- "$base"
          printf 'incomplete: interruption control, never a baseline\njob: %s\nTERM variant: %s\ndeadline variant: %s (%s)\nassertions: %s\nfinished: %s\n' \
            "$JOB_STATUS" "$TERM_OUTCOME" "$DEADLINE_OUTCOME" "$(cat -- "$base/deadline-verdict.txt" 2>/dev/null || printf 'no verdict')" \
            "$ASSERTIONS" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > "$base/status"
          cat -- "$base/status"
      - name: Upload the attempt
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: node-baseline-darwin-interrupt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/node-baseline-darwin-interrupt
          if-no-files-found: error
